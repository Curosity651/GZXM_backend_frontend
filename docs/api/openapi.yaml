openapi: 3.1.0
info:
  title: 重点项目科研管理系统 API
  version: 1.0.0
  description: |
    当前 React 原型对应的后端契约。ID 在 JSON 中统一使用 string；时间为 RFC 3339，日期为 ISO 8601。
    归档材料无审批流程；成果和月季报采用初审、终审并保留提交版本快照。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 登录与当前会话 }
  - { name: Users, description: 用户、角色、单位 }
  - { name: Topics, description: 课题与成员关系 }
  - { name: Indicators, description: 考核节点与两级指标 }
  - { name: Achievements, description: 成果填报、审批与进度 }
  - { name: Reports, description: 月季报规则、填报与审批 }
  - { name: Archives, description: 国家材料与配套自筹材料 }
  - { name: Files, description: 存储无关的文件服务 }
  - { name: Dashboard, description: 工作台统计 }

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 登录成功, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security: []
      responses:
        '200': { description: 刷新成功, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses: { '204': { description: 已退出 } }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200': { description: 当前用户、权限和课题关系, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: roleId, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 用户分页, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
    post:
      tags: [Users]
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateRequest' } } } }
      responses:
        '201': { description: 已使用管理员指定的登录密码创建, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [Users]
      operationId: getUser
      responses: { '200': { description: 用户详情, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
    patch:
      tags: [Users]
      operationId: updateUserProfile
      description: 编辑用户名、角色、联系人、手机和邮箱；平台角色与课题单位角色不能直接互换，修改角色后旧会话失效。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdateRequest' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /users/{userId}/status:
    put:
      tags: [Users]
      operationId: setUserStatus
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '200': { description: 已更新；停用时现有会话立即失效, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  '/users/{userId}/password':
    put:
      tags: [Users]
      operationId: changeUserPassword
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses:
        '204': { description: 密码已修改，账号原有会话立即失效 }

  /roles:
    get:
      tags: [Users]
      operationId: listRoles
      responses: { '200': { description: 角色列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } }
  /roles/{roleId}:
    get:
      tags: [Users]
      operationId: getRole
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses: { '200': { description: 角色详情, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } } }
    put:
      tags: [Users]
      operationId: updateRolePermissions
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionRequest' } } } }
      responses: { '200': { description: 已更新并清除权限缓存, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } } }
  /permissions:
    get:
      tags: [Users]
      operationId: listPermissions
      responses: { '200': { description: 页面与动作权限目录, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Permission' } } } } } }
  /units:
    get:
      tags: [Users]
      operationId: listUnits
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: internal, in: query, schema: { type: boolean } }
      responses: { '200': { description: 单位列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } } }

  /topics:
    get:
      tags: [Topics]
      operationId: listTopics
      description: 全局角色返回全部课题，课题单位仅返回有效成员关系关联的课题。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses: { '200': { description: 课题分页, content: { application/json: { schema: { $ref: '#/components/schemas/TopicPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
    post:
      tags: [Topics]
      operationId: createTopic
      description: 仅具有topic.manage权限的科研助理创建。必须且仅有一个有效重点项目；默认DRAFT且enabled=true。participantUnitIds在创建时一并添加，不得重复或包含牵头单位。课题与成员关系在同一事务保存。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TopicWriteRequest' } } } }
      responses: { '201': { description: 已创建并建立唯一 LEAD 关系, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /topics/{topicId}:
    parameters: [{ $ref: '#/components/parameters/TopicId' }]
    get:
      tags: [Topics]
      operationId: getTopic
      responses: { '200': { description: 课题详情, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
    put:
      tags: [Topics]
      operationId: updateTopic
      description: 仅科研助理维护。recordVersion在编辑时必须携带最新值，否则409。participantUnitIds省略或空数组时保留原成员，传入时只补充新关系，已有关系包括停用关系不自动改变。更换牵头时原子更新，新牵头原有关系恢复有效，旧牵头保留为有效承担单位。暂停、关闭或停用时拒绝普通编辑。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TopicWriteRequest' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /topics/{topicId}/status:
    put:
      tags: [Topics]
      operationId: setTopicStatus
      description: 仅科研助理维护。enabled必填，status省略则保持原业务状态。enabled=false表示软删除式停用，停用期间历史只读；重新启用时恢复停用前的草稿、实施中、暂停或结题状态。本接口按课题行锁串行处理并递增recordVersion。
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, status: { $ref: '#/components/schemas/TopicStatus' } } } } } }
      responses: { '200': { description: 已更新；停用后历史只读, content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /topics/{topicId}/members:
    get:
      tags: [Topics]
      operationId: listTopicMembers
      description: 当前有效成员和管理角色可查看该课题所有成员关系（含停用关系）。已被停用的单位不能凭原成员身份读取，历史由管理角色查看。
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses: { '200': { description: 可见成员列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopicMembership' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
    post:
      tags: [Topics]
      operationId: addTopicParticipant
      description: 仅具有topic-unit.manage权限的本课题有效牵头单位可添加有效单位。已有关系（包括停用关系）返回409；恢复关系请调用成员状态接口。全局管理角色不能代为操作。成功递增课题recordVersion。
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [unitId], properties: { unitId: { type: string } } } } } }
      responses: { '201': { description: 已添加承担单位, content: { application/json: { schema: { $ref: '#/components/schemas/TopicMembership' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /topics/{topicId}/members/{membershipId}/status:
    put:
      tags: [Topics]
      operationId: setTopicMembershipStatus
      description: 仅本课题有效牵头单位可启停承担关系，不能修改牵头关系。membershipId必须属于路径中的topicId。启用要求单位有效。无物理删除；成功递增课题recordVersion。请求无客户端版本，采用课题行锁串行化。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { name: membershipId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '200': { description: 已更新成员关系, content: { application/json: { schema: { $ref: '#/components/schemas/TopicMembership' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: '课题或课题内成员不存在', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }

  /time-nodes:
    get:
      tags: [Indicators]
      operationId: listTimeNodes
      description: 要求page:topic-indicator权限。默认查询启用节点；科研助理可设置includeDisabled=true查看全部节点。
      parameters: [{ name: includeDisabled, in: query, schema: { type: boolean, default: false } }]
      responses: { '200': { description: 考核节点, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimeNode' } } } } } }
    post:
      tags: [Indicators]
      operationId: createTimeNode
      description: 仅科研助理可新增全项目共用的累计指标时间节点。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TimeNodeWrite' } } } }
      responses: { '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/TimeNode' } } } } }
  /time-nodes/{nodeId}:
    parameters: [{ name: nodeId, in: path, required: true, schema: { type: string } }]
    put:
      tags: [Indicators]
      operationId: updateTimeNode
      description: 已产生指标数据的节点不能改变排序，但可修改名称和截止日期。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TimeNodeWrite' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/TimeNode' } } } } }
    delete:
      tags: [Indicators]
      operationId: deleteTimeNode
      description: 仅科研助理可删除；已经被课题指标、单位分配、发布历史或成果引用的节点返回409，禁止删除。
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: 时间节点不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /time-nodes/{nodeId}/status:
    put:
      tags: [Indicators]
      operationId: setTimeNodeStatus
      parameters: [{ name: nodeId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '200': { description: 已启用或停用, content: { application/json: { schema: { $ref: '#/components/schemas/TimeNode' } } } } }
  /indicator-definitions:
    get:
      tags: [Indicators]
      operationId: listIndicatorDefinitions
      description: 要求page:topic-indicator权限。仅返回启用指标定义，按id排序；尚未初始化定义时返回空数组。
      responses: { '200': { description: 五类基础成果和固定专项指标, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IndicatorDefinition' } } } } } }
  /topics/{topicId}/indicator-targets:
    get:
      tags: [Indicators]
      operationId: listTopicIndicatorTargets
      description: 默认读取已发布的生效目标，课题有效成员及管理角色可读历史。view=draft仅限具有indicator.manage权限的科研助理，响应X-Draft-Version给出节点草稿版本，未创建为0。草稿不影响生效目标。
      parameters:
        - { $ref: '#/components/parameters/TopicId' }
        - { name: nodeId, in: query, required: true, schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [effective, draft], default: effective } }
      responses: { '200': { description: 当前节点课题累计目标, headers: { X-Draft-Version: { description: 草稿查询时返回，保存时作为draftVersion提交, schema: { type: integer, minimum: 0 } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopicIndicator' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
    put:
      tags: [Indicators]
      operationId: saveTopicIndicatorTargets
      description: 仅科研助理且具有indicator.manage权限。按节点完整替换草稿，空数组清空未发布草稿；首次draftVersion省略或为0，后续必须匹配X-Draft-Version，冲突409。保存后版本增加；检查前后节点累计不递减、重复维度、节点归属、启用定义及专项不超过同类基础总量。已发布目标本阶段不得删除或降额，修改草稿不会改变生效目标。
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IndicatorTargetBatch' } } } }
      responses: { '200': { description: 已保存草稿, headers: { X-Draft-Version: { description: 保存后的节点草稿版本, schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopicIndicator' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  '/topics/{topicId}/indicator-targets:publish':
    post:
      tags: [Indicators]
      operationId: publishTopicIndicatorTargets
      description: 仅科研助理且具有topic-indicator.publish权限；必须提交所发布draftVersion及8到100位可见ASCII的Idempotency-Key。发布非空草稿，原子更新生效值并保留历史。同一用户同键同课题/节点/草稿版本重放204且不重复发布；同键不同请求409。重试旧成功发布不会发布新草稿。暂停、关闭、停用课题拒绝新发布。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nodeId, draftVersion], properties: { nodeId: { type: string }, draftVersion: { type: integer, minimum: 1, maximum: 2147483647 } } } } } }
      responses: { '204': { description: 已下发或原成功请求重放 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /topics/{topicId}/unit-allocations:
    get:
      tags: [Indicators]
      operationId: listUnitAllocations
      description: 默认view=effective读取生效分配；管理角色和当前牵头看全课题，承担单位只能看自身。view=draft仅当前牵头且有unit-allocation.manage权限可读，返回X-Draft-Version和X-Topic-Indicator-Version响应头。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { name: nodeId, in: query, required: true, schema: { type: string } }, { name: view, in: query, schema: { type: string, enum: [effective, draft], default: effective } }]
      responses: { '200': { description: 当前节点的本阶段单位分配, headers: { X-Draft-Version: { description: 草稿版本，仅草稿查询返回, schema: { type: integer, minimum: 0 } }, X-Topic-Indicator-Version: { description: 草稿绑定的课题指标发布版本，仅草稿查询返回, schema: { type: integer, minimum: 0 } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitIndicatorAllocation' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
    put:
      tags: [Indicators]
      operationId: saveUnitAllocations
      description: 当前有效牵头且有unit-allocation.manage权限。完整替换节点的本阶段分配草稿，首次draftVersion省略或0，后续必须匹配响应X-Draft-Version；每行单位/定义不能重复，单位须为有效且启用成员，目标须已由课题下发。
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitAllocationBatch' } } } }
      responses: { '200': { description: 已保存, headers: { X-Draft-Version: { description: 保存后的草稿版本, schema: { type: integer, minimum: 1 } }, X-Topic-Indicator-Version: { description: 草稿绑定的课题指标发布版本, schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitIndicatorAllocation' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  '/topics/{topicId}/unit-allocations:publish':
    post:
      tags: [Indicators]
      operationId: publishUnitAllocations
      description: 当前有效牵头且有unit-allocation.publish权限。必须覆盖所有有效且启用成员（含牵头）和该节点全部生效指标，零目标显式填0；每项单位合计必须等于课题本阶段要求。课题目标版本变化后须重新保存草稿。请求绑定draftVersion；同一用户同键同请求重放204，不同请求409。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nodeId, draftVersion], properties: { nodeId: { type: string }, draftVersion: { type: integer, minimum: 1, maximum: 2147483647 } } } } } }
      responses: { '204': { description: 已下发或成功重放 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  '/topics/{topicId}/unit-allocations:confirm':
    put:
      tags: [Indicators]
      operationId: confirmUnitAllocations
      description: 当前有效牵头一次确认单位分配并立即生效；草稿写入与发布处于同一事务，任一步失败整体回滚。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitAllocationBatch' } } } }
      responses: { '204': { description: 分配已确认并生效 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  '/topics/{topicId}/unit-allocations:confirm-plan':
    put:
      tags: [Indicators]
      operationId: confirmUnitAllocationPlan
      description: 当前有效牵头一次提交全部启用时间阶段的完整单位分配方案；任一阶段缺失、任一单位指标未覆盖或阶段合计不等于课题本阶段目标时拒绝，全部阶段在同一事务中生效。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitAllocationPlanBatch' } } } }
      responses: { '204': { description: 全部分配方案已确认并生效 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }

  /achievements:
    get:
      tags: [Achievements]
      operationId: listAchievements
      description: 按当前有效成员关系过滤：管理角色全局、牵头本课题全单位、承担单位仅自身。pendingForMe=true按科研助理初审权限或技术负责人终审权限过滤当前待办；其他用户返回空列表。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: topicId, in: query, schema: { type: string } }
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: unitId, in: query, schema: { type: string } }
        - { name: indicatorDefinitionId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: pendingForMe, in: query, schema: { type: boolean } }
      responses: { '200': { description: 按数据范围过滤的成果分页, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果或课题不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公开关联能力尚未接入，FILE_REFERENCE_CAPABILITY_UNAVAILABLE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
    post:
      tags: [Achievements]
      operationId: createAchievement
      description: 仅具有achievement.submit权限的有效启用成员单位；必须绑定本单位已下发的基础指标，零目标允许。归属由服务端解析；初始DRAFT、不计完成量。detail字段按现有五类表单校验，草稿允许缺项。A的文件关联能力尚未接入，非空materialAttachments返回503并回滚。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementWriteRequest' } } } }
      responses: { '201': { description: 已创建草稿, content: { application/json: { schema: { $ref: '#/components/schemas/Achievement' } } } }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '404': { description: 成果或课题不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公开关联能力尚未接入，FILE_REFERENCE_CAPABILITY_UNAVAILABLE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /achievements/{achievementId}:
    parameters: [{ $ref: '#/components/parameters/AchievementId' }]
    get:
      tags: [Achievements]
      operationId: getAchievement
      description: 按有效课题关系、单位归属和当前牵头范围读取。materials仅当前文件，materialLinks保留材料关联历史。文件公开能力未接入时，包含材料的记录暂无法返回完整详情。
      responses: { '200': { description: 成果详情, content: { application/json: { schema: { $ref: '#/components/schemas/Achievement' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果或课题不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公开关联能力尚未接入，FILE_REFERENCE_CAPABILITY_UNAVAILABLE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
    put:
      tags: [Achievements]
      operationId: updateAchievement
      description: 仅所属单位可编辑草稿、退回、待见刊或待授权补充状态，审批中及生效后锁定；必须匹配recordVersion，否则409。课题、单位、节点、指标归属不可更换。detail为完整替换；materialAttachments省略保留、空数组移除当前关联但留历史，同类可多文件。非空附件在文件能力接入前返回503并回滚。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementWriteRequest' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Achievement' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果或课题不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公开关联能力尚未接入，FILE_REFERENCE_CAPABILITY_UNAVAILABLE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /achievements/{achievementId}/actions:
    post:
      tags: [Achievements]
      operationId: executeAchievementAction
      description: 按成果类型和当前状态执行预审提交、投稿登记、进入正式草稿、正式或补充提交。必须携带recordVersion。每次提交生成新不可变快照；正式和补充必须满足材料及日期规则，文件能力未接入返回503。Idempotency-Key在当前用户的成果动作与审批中共享，同键同请求重放原响应，同键不同请求409。
      parameters: [{ $ref: '#/components/parameters/AchievementId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementActionRequest' } } } }
      responses: { '200': { description: 状态流转完成, content: { application/json: { schema: { $ref: '#/components/schemas/Achievement' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公共能力尚未接入, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /achievements/{achievementId}/reviews:
    post:
      tags: [Achievements]
      operationId: reviewAchievement
      description: 仅科研助理初审、项目技术负责人终审，角色和动作权限同时检查；必须匹配recordVersion与submittedVersion，退回意见必填。退回重提回初审。五类成果在第二轮正式终审通过后即计入完成，其中论文须已录用、专利须已授权、软件著作权须取得证书；论文/专利仍保留第三轮后续补充材料双审，进入或退回补充阶段不撤销已经取得的完成计数。成功重试返回原审批记录。
      parameters: [{ $ref: '#/components/parameters/AchievementId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementReviewRequest' } } } }
      responses: { '201': { description: 审批完成, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRecord' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公共能力尚未接入, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /achievements/{achievementId}/snapshots:
    get:
      tags: [Achievements]
      operationId: listAchievementSnapshots
      description: 按当前成果数据范围返回不可变提交快照，提交版本倒序，仅查询ACHIEVEMENT；与审批记录分开，审批历史见成果详情approvals。
      parameters: [{ $ref: '#/components/parameters/AchievementId' }]
      responses: { '200': { description: 不可变提交版本, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SubmissionSnapshot' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 成果不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '503': { description: 文件公共能力尚未接入, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /achievement-progress:
    get:
      tags: [Achievements]
      operationId: getAchievementProgress
      description: 按同项目节点sortOrder累计成果，读取当前事实而非历史时点；阶段按历史证据去重，完成数以countsToIndicator=true为准，包含正式终审已通过且正在后续补充流程的论文/专利。只取查询节点已下发目标作分母。零目标或未下发完成率null，允许超过100%。停用成员/单位仅管理角色可见historical行，不计当前汇总。专项独立展示，不累加到基础总数；非法match_rule返回422。
      parameters:
        - { name: topicId, in: query, schema: { type: string } }
        - { name: nodeId, in: query, required: true, schema: { type: string } }
        - { name: unitId, in: query, schema: { type: string } }
      responses: { '200': { description: 基础总量与专项子集进度, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementProgress' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '404': { description: 统计节点或课题不存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } }

  /topics/{topicId}/report-rule:
    get:
      tags: [Reports]
      operationId: getTopicReportRule
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      responses: { '200': { description: 课题独立规则, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRule' } } } } }
    put:
      tags: [Reports]
      operationId: updateTopicReportRule
      parameters: [{ $ref: '#/components/parameters/TopicId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRule' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRule' } } } } }
  /reports:
    get:
      tags: [Reports]
      operationId: listReports
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: topicId, in: query, schema: { type: string } }
        - { name: reportType, in: query, schema: { $ref: '#/components/schemas/ReportType' } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: period, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: pendingForMe, in: query, schema: { type: boolean } }
      responses: { '200': { description: 只返回实际创建的报告, content: { application/json: { schema: { $ref: '#/components/schemas/ReportPage' } } } } }
    post:
      tags: [Reports]
      operationId: createReport
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreateRequest' } } } }
      responses: { '201': { description: 已按课题规则创建, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressReport' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /reports/{reportId}:
    parameters: [{ $ref: '#/components/parameters/ReportId' }]
    get:
      tags: [Reports]
      operationId: getReport
      responses: { '200': { description: 报告详情, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressReport' } } } } }
    put:
      tags: [Reports]
      operationId: updateReport
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportContentRequest' } } } }
      responses: { '200': { description: 已保存草稿, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressReport' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  '/reports/{reportId}:submit':
    post:
      tags: [Reports]
      operationId: submitReport
      description: 示范工程进展正式提交时至少300字；确无进展时可单独填写“无”。草稿保存不受最少字数限制。
      parameters: [{ $ref: '#/components/parameters/ReportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: 已提交初审并冻结版本, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressReport' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /reports/{reportId}/reviews:
    post:
      tags: [Reports]
      operationId: reviewReport
      parameters: [{ $ref: '#/components/parameters/ReportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses: { '201': { description: 审批完成, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRecord' } } } } }
  /reports/{reportId}/snapshots:
    get:
      tags: [Reports]
      operationId: listReportSnapshots
      parameters: [{ $ref: '#/components/parameters/ReportId' }]
      responses: { '200': { description: 报告提交版本, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SubmissionSnapshot' } } } } } }
  /report-progress:
    get:
      tags: [Reports]
      operationId: getReportProgress
      parameters: [{ name: topicId, in: query, schema: { type: string } }, { name: year, in: query, schema: { type: integer } }]
      responses: { '200': { description: 已创建报告的提交与审批统计, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }

  /archive/national:
    get:
      tags: [Archives]
      operationId: listNationalArchiveDirectories
      parameters: [{ name: topicId, in: query, schema: { type: string } }, { name: unitId, in: query, schema: { type: string } }]
      responses: { '200': { description: 按课题和单位隔离的国家材料目录, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArchiveDirectory' } } } } } }
  /archive/national/topics/{topicId}/units/{unitId}/folders:
    get:
      tags: [Archives]
      operationId: listNationalArchiveFolders
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/UnitId' }]
      responses: { '200': { description: 固定要求和本单位自定义文件夹, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArchiveFolder' } } } } } }
    post:
      tags: [Archives]
      operationId: createNationalCustomFolder
      description: 有权访问该目录的管理角色或本单位账号可创建；required=true表示必存，false表示有则必存。
      parameters: [{ $ref: '#/components/parameters/TopicId' }, { $ref: '#/components/parameters/UnitId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 200 }, required: { type: boolean, default: true } } } } } }
      responses: { '201': { description: 已创建单位私有文件夹, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveFolder' } } } } }
  /archive/folders/{folderId}:
    delete:
      tags: [Archives]
      operationId: deleteCustomArchiveFolder
      description: 只允许删除有权管理的空自定义文件夹；系统模板不可删除，技术负责人和科研助理创建的文件夹只有创建者可删除。
      parameters: [{ $ref: '#/components/parameters/FolderId' }]
      responses: { '204': { description: 已删除空的自定义文件夹 }, '409': { $ref: '#/components/responses/Conflict' } }
  /archive/folders/{folderId}/files:
    get:
      tags: [Archives]
      operationId: listArchiveFolderFiles
      parameters: [{ $ref: '#/components/parameters/FolderId' }]
      responses: { '200': { description: 文件列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FileObject' } } } } } }
    post:
      tags: [Archives]
      operationId: attachFileToArchiveFolder
      parameters: [{ $ref: '#/components/parameters/FolderId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fileId], properties: { fileId: { type: string } } } } } }
      responses: { '201': { description: 已关联并直接计入归档完成度, content: { application/json: { schema: { $ref: '#/components/schemas/FileObject' } } } } }
  /archive/folders/{folderId}/files/{fileId}:
    delete:
      tags: [Archives]
      operationId: removeArchiveFolderFile
      parameters: [{ $ref: '#/components/parameters/FolderId' }, { $ref: '#/components/parameters/FileId' }]
      responses: { '204': { description: 已解除关联；物理文件仍可被其他业务引用 } }
  /self-funded-projects:
    get:
      tags: [Archives]
      operationId: listSelfFundedProjects
      parameters: [{ name: topicId, in: query, schema: { type: string } }, { name: unitId, in: query, schema: { type: string } }]
      responses: { '200': { description: 内部单位可见范围内的项目, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SelfFundedProject' } } } } } }
    post:
      tags: [Archives]
      operationId: createSelfFundedProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SelfFundedProjectRequest' } } } }
      responses: { '201': { description: 已创建并冻结材料模板, content: { application/json: { schema: { $ref: '#/components/schemas/SelfFundedProject' } } } } }
  /self-funded-projects/{projectId}:
    get:
      tags: [Archives]
      operationId: getSelfFundedProject
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 项目与材料完成度, content: { application/json: { schema: { $ref: '#/components/schemas/SelfFundedProject' } } } } }
    put:
      tags: [Archives]
      operationId: updateSelfFundedProject
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SelfFundedProjectRequest' } } } }
      responses: { '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/SelfFundedProject' } } } } }
  /self-funded-projects/{projectId}/folders:
    get:
      tags: [Archives]
      operationId: listSelfFundedProjectFolders
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 项目创建时冻结的文件夹清单, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArchiveFolder' } } } } } }
    post:
      tags: [Archives]
      operationId: createSelfFundedCustomFolder
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 200 }, required: { type: boolean, default: true } } } } } }
      responses: { '201': { description: 已创建自定义材料文件夹, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveFolder' } } } } }
  /archive-progress:
    get:
      tags: [Archives]
      operationId: getArchiveProgress
      parameters: [{ name: topicId, in: query, schema: { type: string } }, { name: unitId, in: query, schema: { type: string } }, { name: ownerType, in: query, schema: { type: string, enum: [TOPIC_NATIONAL, SELF_FUNDED] } }]
      responses: { '200': { description: 科研助理与技术负责人可见的归档统计, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArchiveProgress' } } } } } }

  /files/upload-tickets:
    post:
      tags: [Files]
      operationId: createUploadTicket
      description: 返回短期上传地址；当前本地实现写入 FILE_STORAGE_ROOT 指定目录，数据库只保存元数据。存储位置通过 FileStorage 抽象可替换为 MinIO/S3。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicketRequest' } } } }
      responses: { '201': { description: 上传票据, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } } }
  '/files/{fileId}:complete':
    post:
      tags: [Files]
      operationId: completeUpload
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses: { '200': { description: 校验对象后登记完成, content: { application/json: { schema: { $ref: '#/components/schemas/FileObject' } } } } }
  /files/{fileId}/download-url:
    get:
      tags: [Files]
      operationId: getDownloadUrl
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses: { '200': { description: 短期下载地址, content: { application/json: { schema: { $ref: '#/components/schemas/SignedUrl' } } } } }
  /files/{fileId}/preview-url:
    get:
      tags: [Files]
      operationId: getPreviewUrl
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses: { '200': { description: 短期预览地址, content: { application/json: { schema: { $ref: '#/components/schemas/SignedUrl' } } } } }
  /files/{fileId}/content:
    put:
      tags: [Files]
      operationId: uploadFileContent
      description: 使用上传票据的 expires 和 signature，携带登录令牌与票据指定的 Content-Type 上传原始字节；大小及可选 SHA-256 由服务端校验。
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '204': { description: 字节已写入配置的文件目录；还需调用 complete } }
    get:
      tags: [Files]
      operationId: readFileContent
      description: 使用短期下载或预览地址，并携带登录令牌；仍会检查当前用户的数据范围和文件状态。仅 PDF 与常见栅格图片允许内联预览，其余类型强制作为附件下载。
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: preview, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: 文件内容, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      responses: { '200': { description: 按当前数据范围聚合的工作台, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
    UserId: { name: userId, in: path, required: true, schema: { type: string } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string } }
    UnitId: { name: unitId, in: path, required: true, schema: { type: string } }
    TopicId: { name: topicId, in: path, required: true, schema: { type: string } }
    AchievementId: { name: achievementId, in: path, required: true, schema: { type: string } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string } }
    FolderId: { name: folderId, in: path, required: true, schema: { type: string } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
  responses:
    Unauthorized: { description: 未登录或令牌失效, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 没有功能或数据权限, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 唯一约束、状态或乐观锁冲突, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ValidationError: { description: 业务或字段校验失败, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: TOPIC_NOT_OPERATIONAL }
        traceId: { type: string }
        fieldErrors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string, minLength: 1 }, password: { type: string, minLength: 6 } }
    TokenResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties: { accessToken: { type: string }, tokenType: { type: string, const: Bearer }, expiresIn: { type: integer }, user: { $ref: '#/components/schemas/CurrentUser' } }
    CurrentUser:
      type: object
      required: [id, username, roleCode, pagePermissions, actionPermissions, memberships]
      properties:
        id: { type: string }
        username: { type: string }
        unitId: { type: [string, 'null'] }
        roleCode: { type: string, enum: [SYSTEM_ADMIN, PROJECT_TECH_LEADER, RESEARCH_ASSISTANT, INTERNAL_TOPIC_UNIT, EXTERNAL_TOPIC_UNIT] }
        pagePermissions: { type: array, items: { type: string } }
        actionPermissions: { type: array, items: { type: string } }
        memberships: { type: array, items: { $ref: '#/components/schemas/TopicMembership' } }
    User:
      type: object
      required: [id, username, name, roleId, roleName, enabled]
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: string, description: 单位联系人姓名 }
        unitId: { type: [string, 'null'] }
        roleId: { type: string }
        roleName: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [username, roleId, name, password]
      description: 课题单位账号的单位由后端按用户名自动创建，内外属性由角色确定。
      properties: { username: { type: string }, roleId: { type: string }, name: { type: string }, phone: { type: string }, email: { type: string, format: email }, enabled: { type: boolean, default: true }, password: { type: string, minLength: 8, maxLength: 72, writeOnly: true } }
    UserCreateResponse:
      type: object
      required: [user]
      properties: { user: { $ref: '#/components/schemas/User' } }
    UserUpdateRequest:
      type: object
      properties: { username: { type: string }, roleId: { type: string }, name: { type: string }, phone: { type: string }, email: { type: string, format: email } }
    PasswordChangeRequest:
      type: object
      required: [password]
      properties: { password: { type: string, minLength: 8, maxLength: 72, writeOnly: true } }
    UserPage:
      type: object
      required: [items, page, size, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } }
    Role:
      type: object
      required: [id, code, name, pagePermissions, actionPermissions, enabled, builtIn]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, description: { type: string }, pagePermissions: { type: array, items: { type: string } }, actionPermissions: { type: array, items: { type: string } }, enabled: { type: boolean }, builtIn: { type: boolean } }
    RolePermissionRequest:
      type: object
      required: [pagePermissions, actionPermissions]
      properties: { pagePermissions: { type: array, uniqueItems: true, items: { type: string } }, actionPermissions: { type: array, uniqueItems: true, items: { type: string } }, enabled: { type: boolean } }
    Permission:
      type: object
      required: [code, name, type, group]
      properties: { code: { type: string }, name: { type: string }, type: { type: string, enum: [PAGE, ACTION] }, group: { type: string } }
    Unit:
      type: object
      required: [id, code, name, internal, enabled]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, internal: { type: boolean }, enabled: { type: boolean } }
    TopicStatus: { type: string, enum: [DRAFT, ACTIVE, PAUSED, CLOSED] }
    Topic:
      type: object
      required: [id, code, name, leadUnitId, status, enabled, recordVersion]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, summary: { type: string }, leadUnitId: { type: string }, status: { $ref: '#/components/schemas/TopicStatus' }, enabled: { type: boolean }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, recordVersion: { type: integer }, members: { type: array, items: { $ref: '#/components/schemas/TopicMembership' } } }
    TopicWriteRequest:
      type: object
      required: [code, name, leadUnitId]
      properties: { code: { type: string }, name: { type: string }, summary: { type: string }, leadUnitId: { type: string }, participantUnitIds: { type: array, items: { type: string } }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, recordVersion: { type: integer } }
    TopicPage:
      type: object
      required: [items, page, size, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Topic' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } }
    TopicMembership:
      type: object
      required: [id, topicId, unitId, membershipType, enabled]
      properties: { id: { type: string }, topicId: { type: string }, unitId: { type: string }, unitName: { type: string }, membershipType: { type: string, enum: [LEAD, PARTICIPANT] }, enabled: { type: boolean } }
    TimeNode:
      type: object
      required: [id, code, name, deadline, sortOrder, enabled]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, deadline: { type: string, format: date }, sortOrder: { type: integer }, enabled: { type: boolean } }
    TimeNodeWrite:
      type: object
      required: [name, deadline, sortOrder]
      properties: { name: { type: string, maxLength: 100 }, deadline: { type: string, format: date }, sortOrder: { type: integer, minimum: 1 } }
    IndicatorDefinition:
      type: object
      required: [id, code, name, achievementType, unit, category]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, achievementType: { type: string, enum: [PAPER, PATENT, COPYRIGHT, STANDARD, TALENT] }, unit: { type: string }, category: { type: string, enum: [BASE, SPECIAL] }, enabled: { type: boolean } }
    TopicIndicator:
      type: object
      required: [id, topicId, nodeId, indicatorDefinitionId, targetQuantity, status, version]
      properties: { id: { type: string }, topicId: { type: string }, nodeId: { type: string }, indicatorDefinitionId: { type: string }, targetQuantity: { type: integer, minimum: 0 }, status: { type: string, enum: [DRAFT, PUBLISHED] }, version: { type: integer } }
    IndicatorTargetBatch:
      type: object
      required: [nodeId, targets]
      properties: { nodeId: { type: string }, draftVersion: { type: integer, minimum: 0, maximum: 2147483647 }, targets: { type: array, maxItems: 500, items: { type: object, required: [indicatorDefinitionId, targetQuantity], properties: { indicatorDefinitionId: { type: string }, targetQuantity: { type: integer, minimum: 0, maximum: 2147483647 } } } } }
    UnitIndicatorAllocation:
      type: object
      required: [id, topicId, unitId, nodeId, indicatorDefinitionId, targetQuantity, status, version]
      properties: { id: { type: string }, topicId: { type: string }, unitId: { type: string }, nodeId: { type: string }, indicatorDefinitionId: { type: string }, targetQuantity: { type: integer, minimum: 0 }, status: { type: string, enum: [DRAFT, PUBLISHED] }, version: { type: integer } }
    UnitAllocationBatch:
      type: object
      required: [nodeId, allocations]
      properties: { nodeId: { type: string }, draftVersion: { type: integer, minimum: 0, maximum: 2147483647 }, allocations: { type: array, maxItems: 5000, items: { type: object, required: [unitId, indicatorDefinitionId, targetQuantity], properties: { unitId: { type: string }, indicatorDefinitionId: { type: string }, targetQuantity: { type: integer, minimum: 0, maximum: 2147483647 } } } } }
    UnitAllocationPlanBatch:
      type: object
      required: [stages]
      properties: { stages: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/UnitAllocationBatch' } } }
    Achievement:
      type: object
      required: [id, topicId, unitId, nodeId, indicatorDefinitionId, achievementType, title, status, recordVersion, submittedVersion, materials]
      properties: { id: { type: string }, topicId: { type: string }, unitId: { type: string }, nodeId: { type: string }, indicatorDefinitionId: { type: string }, achievementType: { type: string }, title: { type: string }, responsiblePerson: { type: string }, status: { $ref: '#/components/schemas/AchievementStatus' }, countsToIndicator: { type: boolean }, recordVersion: { type: integer }, submittedVersion: { type: integer }, detail: { $ref: '#/components/schemas/AchievementDetail' }, materialLinks: { type: array, items: { $ref: '#/components/schemas/AchievementMaterialLink' } }, materials: { type: array, items: { $ref: '#/components/schemas/FileObject' } }, approvals: { type: array, items: { $ref: '#/components/schemas/ApprovalRecord' } }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    AchievementWriteRequest:
      type: object
      required: [topicId, nodeId, indicatorDefinitionId, title, responsiblePerson]
      properties: { topicId: { type: string }, nodeId: { type: string }, indicatorDefinitionId: { type: string }, title: { type: string, minLength: 1, maxLength: 500 }, responsiblePerson: { type: string, minLength: 1, maxLength: 100 }, detail: { $ref: '#/components/schemas/AchievementDetail' }, materialAttachments: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AchievementMaterialInput' } }, materialFileIds: { type: array, maxItems: 0, deprecated: true, items: { type: string }, description: 非空旧式文件ID列表会返回422，请改用结构化材料 }, recordVersion: { type: integer, minimum: 1, maximum: 2147483647 } }
    AchievementActionRequest:
      type: object
      required: [action, recordVersion]
      properties:
        action: { type: string, enum: [SUBMIT_PRE_REVIEW, REGISTER_EXTERNAL_SUBMISSION, START_FORMAL, SUBMIT_FORMAL, SUBMIT_SUPPLEMENT] }
        recordVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        externalSubmissionDate: { type: string, format: date, description: 仅登记动作使用且必填；论文映射submissionDate，专利映射applicationDate }
        externalSubmissionNumber: { type: string, maxLength: 500, description: 仅登记动作使用，可选；论文映射externalSubmissionNumber，专利映射applicationNumber }
    AchievementReviewRequest:
      type: object
      required: [decision, recordVersion, submittedVersion]
      properties:
        decision: { type: string, enum: [APPROVE, RETURN] }
        opinion: { type: string, maxLength: 1000, description: RETURN时必填且不能是空白 }
        recordVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        submittedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
    AchievementStatus:
      type: string
      enum: [DRAFT, PRE_INITIAL, PRE_FINAL, PRE_RETURNED, PRE_APPROVED, EXTERNAL_SUBMITTED, FORMAL_DRAFT, FORMAL_INITIAL, FORMAL_FINAL, FORMAL_RETURNED, WAIT_PUBLICATION, WAIT_GRANT, SUPPLEMENT_INITIAL, SUPPLEMENT_FINAL, SUPPLEMENT_RETURNED, EFFECTIVE]
    AchievementPage:
      type: object
      required: [items, page, size, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Achievement' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } }
    AchievementProgress:
      type: object
      required: [nodeId, countingBasis, baseTotals, baseStages, specialIndicators, rows]
      properties:
        nodeId: { type: string }
        countingBasis: { type: string, enum: [CUMULATIVE_NODE_CURRENT_FACTS] }
        baseTotals:
          type: object
          description: 当前可见有效成员的五类生效成果数，各成果只计一次，排除历史行与专项重复
          required: [PAPER, PATENT, COPYRIGHT, STANDARD, TALENT]
          properties:
            PAPER: { type: integer, format: int64, minimum: 0 }
            PATENT: { type: integer, format: int64, minimum: 0 }
            COPYRIGHT: { type: integer, format: int64, minimum: 0 }
            STANDARD: { type: integer, format: int64, minimum: 0 }
            TALENT: { type: integer, format: int64, minimum: 0 }
          additionalProperties: false
        baseStages: { $ref: '#/components/schemas/AchievementStageCounts' }
        specialIndicators: { type: array, description: 专项行独立于基础行，可能交叠，不能累加为基础总数, items: { $ref: '#/components/schemas/AchievementProgressRow' } }
        rows: { type: array, description: 基础指标行；TOPIC与UNIT不能相加；historical=true仅管理角色可见且不计汇总, items: { $ref: '#/components/schemas/AchievementProgressRow' } }
    AchievementStageCounts:
      type: object
      required: [initiated, submitted, preApproved, external, formal, supplement, effective]
      properties:
        initiated: { type: integer, format: int64, minimum: 0, description: 已创建的成果数 }
        submitted: { type: integer, format: int64, minimum: 0, description: 已进入审批或后续流程的成果数，不含初始草稿 }
        preApproved: { type: integer, format: int64, minimum: 0, description: 曾有预审终审通过记录的成果数 }
        external: { type: integer, format: int64, minimum: 0, description: 曾成功登记投稿或申请的论文及专利数 }
        formal: { type: integer, format: int64, minimum: 0, description: 曾有FORMAL提交快照的成果数 }
        supplement: { type: integer, format: int64, minimum: 0, description: 曾有SUPPLEMENT提交快照的成果数 }
        effective: { type: integer, format: int64, minimum: 0, description: 当前EFFECTIVE且countsToIndicator=true的成果数 }
    AchievementProgressRow:
      type: object
      required: [scope, topicId, unitId, nodeId, indicatorDefinitionId, achievementType, targetQuantity, targetVersion, targetPublished, hasTarget, completionRate, historical, stages]
      properties:
        scope: { type: string, enum: [TOPIC, UNIT] }
        topicId: { type: string }
        unitId: { type: [string, 'null'], description: TOPIC行固定null }
        nodeId: { type: string }
        indicatorDefinitionId: { type: string }
        achievementType: { type: string, enum: [PAPER, PATENT, COPYRIGHT, STANDARD, TALENT] }
        targetQuantity: { type: [integer, 'null'], format: int64, minimum: 0, description: 查询节点已下发目标；未下发为null }
        targetVersion: { type: [integer, 'null'], minimum: 0 }
        targetPublished: { type: boolean, description: 是否存在该查询节点的已下发目标 }
        hasTarget: { type: boolean, description: 是否有正数目标；零目标和未下发均为false }
        completionRate: { type: [number, 'null'], minimum: 0, description: 生效数乘100除以目标，两位小数四舍五入；无正目标为null，不限制100上限 }
        historical: { type: boolean, description: 停用成员或停用单位，管理角色单独展示，不计当前汇总 }
        stages: { $ref: '#/components/schemas/AchievementStageCounts' }
    ReviewRequest:
      type: object
      required: [decision]
      properties: { decision: { type: string, enum: [APPROVE, RETURN] }, opinion: { type: string }, submittedVersion: { type: integer, description: 客户端正在审批的提交版本，用于并发冲突检测 } }
    ApprovalRecord:
      type: object
      required: [id, businessType, businessId, stage, level, decision, operatorId, operatedAt, submittedVersion]
      properties: { id: { type: string }, businessType: { type: string, enum: [ACHIEVEMENT, REPORT] }, businessId: { type: string }, stage: { type: string }, level: { type: string, enum: [INITIAL, FINAL] }, decision: { type: string, enum: [APPROVED, RETURNED] }, opinion: { type: string }, operatorId: { type: string }, operatedAt: { type: string, format: date-time }, submittedVersion: { type: integer } }
    SubmissionSnapshot:
      type: object
      required: [id, businessType, businessId, stage, submittedVersion, submittedAt, submitterId, payload]
      properties: { id: { type: string }, businessType: { type: string, enum: [ACHIEVEMENT, REPORT] }, businessId: { type: string }, stage: { type: string }, submittedVersion: { type: integer }, submittedAt: { type: string, format: date-time }, submitterId: { type: string }, payload: { type: object, additionalProperties: true } }
    ReportType: { type: string, enum: [MONTHLY, QUARTERLY] }
    ReportRule:
      type: object
      required: [effectiveYear, monthlyEnabled, quarterlyEnabled, monthlyOpenDay, monthlyDeadlineDay, quarterlyOpenDay, quarterlyDeadlineDay, quarterlyMonths]
      properties: { effectiveYear: { type: integer }, monthlyEnabled: { type: boolean }, monthlyOpenDay: { type: integer, minimum: 1, maximum: 31 }, monthlyDeadlineDay: { type: integer, minimum: 1, maximum: 31 }, quarterlyEnabled: { type: boolean }, quarterlyOpenDay: { type: integer, minimum: 1, maximum: 31 }, quarterlyDeadlineDay: { type: integer, minimum: 1, maximum: 31 }, quarterlyMonths: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }, recordVersion: { type: integer } }
    ReportCreateRequest:
      type: object
      required: [topicId, reportType, year, period]
      properties: { topicId: { type: string }, reportType: { $ref: '#/components/schemas/ReportType' }, year: { type: integer }, period: { type: integer } }
    ReportContentRequest:
      type: object
      required: [basicInformation, milestoneProgress, overallProgress, researchAchievements, demonstrationProgress, fundUsage, nextPlan, problemsAndMeasures, recordVersion]
