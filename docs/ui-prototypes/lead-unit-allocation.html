<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>牵头单位 - 单位指标分配</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      color: #1f2329;
      background: #f2f5fa;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
    }
    .card {
      max-width: 1480px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e8ef;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgb(31 35 41 / 5%);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 16px 24px;
      border-bottom: 1px solid #edf0f5;
    }
    h1 { margin: 0; font-size: 20px; }
    .status { color: #646a73; }
    .status strong { margin-left: 8px; color: #d46b08; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #edf0f5;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab {
      padding: 9px 16px;
      color: #4e5969;
      background: #f5f6f8;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab.active { color: #1456c0; background: #eaf2ff; border-color: #8fbdff; }
    .tab.done::after { margin-left: 6px; color: #00a870; content: "✓"; }
    .tab.warning::after { margin-left: 6px; color: #e37318; content: "!"; }
    .submit {
      height: 40px;
      padding: 0 20px;
      color: #fff;
      background: #3370ff;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    .context { padding: 18px 24px; }
    .context strong { display: block; margin-bottom: 8px; font-size: 16px; }
    .context span { color: #646a73; }
    .table-wrap { overflow-x: auto; padding: 0 24px 24px; }
    table { width: 100%; min-width: 1120px; border-collapse: separate; border-spacing: 0; }
    th, td {
      height: 56px;
      padding: 9px 12px;
      text-align: center;
      border-right: 1px solid #e5e8ef;
      border-bottom: 1px solid #e5e8ef;
    }
    thead th { color: #344563; background: #f6f8fb; font-weight: 600; }
    tr > :first-child { border-left: 1px solid #e5e8ef; }
    thead tr:first-child th { border-top: 1px solid #e5e8ef; }
    thead tr:first-child th:first-child { border-top-left-radius: 8px; }
    thead tr:first-child th:last-child { border-top-right-radius: 8px; }
    .metric { width: 240px; text-align: left; }
    .unit-group { min-width: 210px; }
    .allocation { width: 180px; }
    .primary { font-weight: 600; }
    .subset { padding-left: 34px; color: #646a73; }
    .number-input {
      width: 76px;
      height: 36px;
      padding: 0 10px;
      text-align: center;
      border: 1px solid #c9cdd4;
      border-radius: 7px;
      font: inherit;
    }
    .number-input:focus { border-color: #3370ff; outline: none; box-shadow: 0 0 0 2px rgb(51 112 255 / 12%); }
    .number-input.missing { border-color: #f54a45; background: #fff8f7; }
    .cumulative { color: #1d4ed8; background: #fafcff; font-weight: 600; }
    .complete { color: #00875a; }
    .incomplete { color: #d46b08; }
    @media (max-width: 800px) {
      body { padding: 12px; }
      .card-header, .toolbar { align-items: flex-start; flex-direction: column; gap: 14px; }
    }
  </style>
</head>
<body>
  <section class="card">
    <header class="card-header">
      <h1>单位指标分配</h1>
      <div class="status">方案状态：<strong>未完成&nbsp;&nbsp;2/4 阶段完成</strong></div>
    </header>

    <div class="toolbar">
      <div class="tabs" aria-label="时间阶段">
        <button class="tab done" type="button">第一年度</button>
        <button class="tab done" type="button">第二年度</button>
        <button class="tab warning active" type="button">第三年度</button>
        <button class="tab warning" type="button">项目结项</button>
      </div>
      <button class="submit" type="button">提交全部分配方案</button>
    </div>

    <div class="context">
      <strong>当前阶段：第三年度</strong>
      <span>课题本阶段目标与各单位分配情况</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="metric" rowspan="2">成果指标</th>
            <th class="unit-group" colspan="2">山东大学</th>
            <th class="unit-group" colspan="2">清华大学</th>
            <th class="unit-group" colspan="2">广西电网</th>
            <th class="allocation" rowspan="2">此阶段分配情况</th>
          </tr>
          <tr>
            <th>本阶段</th><th>累计</th>
            <th>本阶段</th><th>累计</th>
            <th>本阶段</th><th>累计</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="metric primary">学术论文总数</td>
            <td><input class="number-input" type="number" min="0" value="3" /></td><td class="cumulative">8</td>
            <td><input class="number-input" type="number" min="0" value="2" /></td><td class="cumulative">6</td>
            <td><input class="number-input missing" type="number" min="0" placeholder="未填" /></td><td class="cumulative">4</td>
            <td class="incomplete">未完成 5/10</td>
          </tr>
          <tr>
            <td class="metric subset">其中：第一作者</td>
            <td><input class="number-input" type="number" min="0" value="1" /></td><td class="cumulative">3</td>
            <td><input class="number-input" type="number" min="0" value="1" /></td><td class="cumulative">2</td>
            <td><input class="number-input" type="number" min="0" value="0" /></td><td class="cumulative">1</td>
            <td class="complete">已完成 2/2</td>
          </tr>
          <tr>
            <td class="metric subset">其中：中文核心</td>
            <td><input class="number-input" type="number" min="0" value="1" /></td><td class="cumulative">2</td>
            <td><input class="number-input missing" type="number" min="0" placeholder="未填" /></td><td class="cumulative">1</td>
            <td><input class="number-input" type="number" min="0" value="0" /></td><td class="cumulative">0</td>
            <td class="incomplete">未完成 1/3</td>
          </tr>
          <tr>
            <td class="metric primary">发明专利总数</td>
            <td><input class="number-input" type="number" min="0" value="2" /></td><td class="cumulative">5</td>
            <td><input class="number-input" type="number" min="0" value="1" /></td><td class="cumulative">3</td>
            <td><input class="number-input" type="number" min="0" value="1" /></td><td class="cumulative">2</td>
            <td class="complete">已完成 4/4</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>
