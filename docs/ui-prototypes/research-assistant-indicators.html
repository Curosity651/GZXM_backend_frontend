<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科研助理 - 课题总体指标</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      color: #1f2329;
      background: #f2f5fa;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
    }
    .card {
      max-width: 1180px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e8ef;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgb(31 35 41 / 5%);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 16px 24px;
      border-bottom: 1px solid #edf0f5;
    }
    h1 { margin: 0; font-size: 20px; }
    .stage-picker { display: flex; align-items: center; gap: 12px; }
    .stage-picker label { font-weight: 600; }
    select {
      width: 190px;
      height: 40px;
      padding: 0 38px 0 14px;
      color: #1f2329;
      background: #fff;
      border: 1px solid #c9cdd4;
      border-radius: 8px;
      outline: none;
      font: inherit;
    }
    select:focus { border-color: #3370ff; box-shadow: 0 0 0 2px rgb(51 112 255 / 12%); }
    .hint {
      margin: 20px 24px;
      padding: 13px 16px;
      color: #245b9e;
      background: #eef6ff;
      border: 1px solid #b8dbff;
      border-radius: 8px;
    }
    .table-wrap { padding: 0 24px 24px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      height: 58px;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid #ebeef3;
    }
    th { color: #344563; background: #f6f8fb; font-weight: 600; }
    th:nth-child(1) { width: 42%; }
    th:nth-child(2) { width: 12%; }
    th:nth-child(3) { width: 22%; }
    th:nth-child(4) { width: 24%; }
    .group-start td { border-top: 1px solid #dfe3eb; }
    .primary { font-weight: 600; }
    .subset { padding-left: 42px; color: #646a73; }
    .number-input {
      width: 112px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #c9cdd4;
      border-radius: 8px;
      font: inherit;
    }
    .number-input:focus { border-color: #3370ff; outline: none; box-shadow: 0 0 0 2px rgb(51 112 255 / 12%); }
    .cumulative { color: #1d4ed8; font-weight: 600; }
    @media (max-width: 760px) {
      body { padding: 12px; }
      .card-header { align-items: flex-start; flex-direction: column; gap: 14px; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 760px; }
    }
  </style>
</head>
<body>
  <section class="card">
    <header class="card-header">
      <h1>课题总体指标</h1>
      <div class="stage-picker">
        <label for="stage">时间阶段</label>
        <select id="stage">
          <option>第一年度</option>
          <option selected>第二年度</option>
          <option>第三年度</option>
          <option>项目结项</option>
        </select>
      </div>
    </header>

    <div class="hint">当前填写“第二年度”内需要完成的指标，右侧累计值由系统自动计算。</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>成果指标</th>
            <th>单位</th>
            <th>本阶段指标</th>
            <th>截至本阶段累计</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="primary">学术论文总数</td>
            <td>篇</td>
            <td><input class="number-input" type="number" min="0" value="10" /></td>
            <td class="cumulative">30</td>
          </tr>
          <tr>
            <td class="subset">其中：广西电网第一作者</td>
            <td>篇</td>
            <td><input class="number-input" type="number" min="0" value="5" /></td>
            <td class="cumulative">15</td>
          </tr>
          <tr>
            <td class="subset">其中：中文核心期刊</td>
            <td>篇</td>
            <td><input class="number-input" type="number" min="0" value="4" /></td>
            <td class="cumulative">12</td>
          </tr>
          <tr class="group-start">
            <td class="primary">发明专利总数</td>
            <td>项</td>
            <td><input class="number-input" type="number" min="0" value="6" /></td>
            <td class="cumulative">18</td>
          </tr>
          <tr>
            <td class="subset">其中：广西电网第一申请人</td>
            <td>项</td>
            <td><input class="number-input" type="number" min="0" value="3" /></td>
            <td class="cumulative">8</td>
          </tr>
          <tr class="group-start">
            <td class="primary">软件著作权总数</td>
            <td>项</td>
            <td><input class="number-input" type="number" min="0" value="4" /></td>
            <td class="cumulative">11</td>
          </tr>
          <tr>
            <td class="subset">其中：广西电网第一完成人</td>
            <td>项</td>
            <td><input class="number-input" type="number" min="0" value="2" /></td>
            <td class="cumulative">6</td>
          </tr>
          <tr class="group-start">
            <td class="primary">标准规范总数</td>
            <td>项</td>
            <td><input class="number-input" type="number" min="0" value="2" /></td>
            <td class="cumulative">5</td>
          </tr>
          <tr>
            <td class="primary">人才培养总数</td>
            <td>人</td>
            <td><input class="number-input" type="number" min="0" value="3" /></td>
            <td class="cumulative">9</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>
