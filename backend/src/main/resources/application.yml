spring:
  application:
    name: gzxm-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/gzxm?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:gzxm}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    issuer: ${JWT_ISSUER:gzxm-local}
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
  file:
    provider: ${FILE_PROVIDER:FILESYSTEM}
    root: ${FILE_STORAGE_ROOT:${FILE_MOCK_ROOT:./storage/files}}
    upload-ticket-ttl: ${FILE_UPLOAD_TICKET_TTL:15m}
    signed-url-ttl: ${FILE_SIGNED_URL_TTL:10m}
    signing-secret: ${FILE_SIGNING_SECRET:}
    webdav:
      base-url: ${NAS_WEBDAV_BASE_URL:}
      username: ${NAS_WEBDAV_USERNAME:}
      password: ${NAS_WEBDAV_PASSWORD:}
      connect-timeout: ${NAS_WEBDAV_CONNECT_TIMEOUT:5s}
      request-timeout: ${NAS_WEBDAV_REQUEST_TIMEOUT:120s}

logging:
  level:
    root: INFO
    com.gzxm: INFO
